description: MoneyGram is a global money transfer and payment services company, enabling individuals and businesses to send and receive funds
  across more than 200 countries and territories. Founded in 1940, MoneyGram offers online, in‑app, and in‑person transfer options, with a network
  of agents and retail locations worldwide. The platform emphasizes security, competitive exchange rates, and multiple payout methods, including
  bank deposits, cash pickup, and digital wallets.

