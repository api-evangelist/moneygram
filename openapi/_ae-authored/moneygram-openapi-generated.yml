components:
  schemas:
    GetFxRateV1RatesResponse:
      type: object
      properties:
        rates:
          type: array
          description: List of FX rates for each service option available to the given destination country
    GetOauthOauthidResponse:
      type: object
      properties:
        refresh_token_expires_in:
          type: string
          description: Optional.
        api_product_list:
          type: array
          description: Optional.
        api_product_list_json:
          type: array
          description: Optional.
        organization_name:
          type: string
          description: Optional.
        developer.email:
          type: string
          description: Optional.
        token_type:
          type: string
          description: Optional.
        issued_at:
          type: string
          description: Optional.
        client_id:
          type: string
          description: Optional.
        access_token:
          type: string
          description: Required.
        application_name:
          type: string
          description: Optional.
        scope:
          type: string
          description: Optional.
        expires_in:
          type: integer
          description: Required. Number of seconds until the token expires.
        refresh_count:
          type: integer
          description: Optional.
        status:
          type: string
          description: Optional.
    PutPartnerconnectV1TransactionsTransactionidStatusRequest:
      type: object
      properties:
        partnerTransactionId:
          type: string
        reasonCode:
          type: string
        partnerReasonMessage:
          type: string
    PutPartnerconnectV1TransactionsTransactionidStatusResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        mgiTransactionId:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    GetReferenceDataV1V1IdResponse:
      type: object
      properties:
        iso3Code:
          type: string
        iso2Code:
          type: string
        name:
          type: string
        baseCurrency:
          type: string
        sendActive:
          type: boolean
        receiveActive:
          type: boolean
        indicativeRateActive:
          type: boolean
        active:
          type: boolean
        sendCurrencies:
          type: array
          items:
            type: string
        receiveCurrencies:
          type: array
          items:
            type: string
        phoneDialCodes:
          type: array
          items:
            type: string
    PutTransactionsMgitransactionidStatusRequest:
      type: object
      properties:
        partnerTransactionId:
          type: string
          description: 'Partner''s unique transaction identifier. If the partner uses the MoneyGram transaction ID, pass the same value here.
            Pattern: ^[A-Za-z0-9_\-]{1,50}$ . Also serves as the idempotency key.'
        reasonCode:
          type: string
          description: Reason code for the transaction status. Must be a valid 5-digit code from the published catalog.
        partnerReasonMessage:
          type: string
          description: Partner's free-text reason message or description, for audit and logging.
      required:
      - partnerTransactionId
      - reasonCode
      - partnerReasonMessage
    PutTransactionsMgitransactionidStatusResponse:
      type: object
      properties:
        status:
          type: string
          description: Status of the update operation, e.g. SUCCESS.
        message:
          type: string
          description: Human-readable success message.
        mgiTransactionId:
          type: string
          description: MoneyGram Transaction ID that was updated.
        requestId:
          type: string
          description: Server-generated correlation ID.
        timestamp:
          type: string
          description: UTC timestamp (ISO 8601) when the update was processed.
    PostV1AccountsValidateRequest:
      type: object
      properties:
        sender.person.firstName:
          type: string
          description: Sender first name.
        sender.person.middleName:
          type: string
          description: Sender middle name.
        sender.person.lastName:
          type: string
          description: Sender last name.
        sender.person.secondLastName:
          type: string
          description: Sender second last name.
        receiver.person.firstName:
          type: string
          description: Beneficiary first name.
        receiver.person.middleName:
          type: string
          description: Beneficiary middle name.
        receiver.person.lastName:
          type: string
          description: Beneficiary last name.
        receiver.person.secondLastName:
          type: string
          description: Beneficiary second last name.
        receiveAmount.value:
          type: number
          description: Receive amount in transacting currency. Must be greater than 0.
        receiveAmount.currencyCode:
          type: string
          description: ISO 4217 currency code.
        accountCode:
          type: string
          description: Bank code, routing code, wallet provider, or IFSC code — used to route the credit to the beneficiary institution.
        accountNumber:
          type: string
          description: Beneficiary bank account or wallet number. Format agreed bilaterally with the partner.
        receiveCountryCode:
          type: string
          description: ISO 3166-1 alpha-3 country code where funds are credited.
        additionalData:
          type: array
          description: Key‑value pairs for regulatory and routing purposes. All supported keys are always included (values may be empty).
      required:
      - receiver.person.firstName
      - receiver.person.lastName
      - receiveAmount.value
      - receiveAmount.currencyCode
      - accountCode
      - accountNumber
      - receiveCountryCode
    PostV1AccountsValidateResponse:
      type: object
      properties:
        message:
          type: string
          description: Optional response message.
        receiver.accountTitle:
          type: string
          description: Name associated with the account.
        receiver.accountStatus:
          type: string
          description: Account status.
        receiver.accountCurrency:
          type: string
          description: Currency of the account.
        receiver.nameMatchPercentage:
          type: string
          description: Percentage match between the beneficiary name and the institution's records.
        receiver.accountType:
          type: string
          description: Type of account.
        error.code:
          type: string
          description: MoneyGram-defined error code.
        error.message:
          type: string
          description: Human‑readable error message.
        error.target:
          type: string
          description: Field causing the error.
    PostV1TransfersRequest:
      type: object
      properties:
        transaction.mgiTransactionId:
          type: string
          description: 'Unique MoneyGram transaction identifier. Format: XXXXXXXX0000MMddYYYY'
        transaction.receiveCountryCode:
          type: string
          description: ISO 3166-1 alpha-3 country code where funds are credited.
        transaction.sendCountryCode:
          type: string
          description: ISO 3166-1 alpha-3 country code where funds originate.
        transaction.receiveAmount.value:
          type: number
          description: Transaction receive amount.
        transaction.receiveAmount.currencyCode:
          type: string
          description: ISO 4217 currency code.
        transaction.sender.person.firstName:
          type: string
          description: Sender first name.
        transaction.sender.person.middleName:
          type: string
          description: Sender middle name.
        transaction.sender.person.lastName:
          type: string
          description: Sender last name.
        transaction.sender.person.secondLastName:
          type: string
          description: Sender second last name.
        transaction.receiver.person.firstName:
          type: string
          description: Beneficiary first name.
        transaction.receiver.person.middleName:
          type: string
          description: Beneficiary middle name.
        transaction.receiver.person.lastName:
          type: string
          description: Beneficiary last name.
        transaction.receiver.person.secondLastName:
          type: string
          description: Beneficiary second last name.
        accountCode:
          type: string
          description: Bank code, routing code, wallet provider name, or IFSC.
        accountNumber:
          type: string
          description: Beneficiary account or wallet number.
        transaction.additionalData[]:
          type: array
          description: Supplementary key‑value pairs required for certain corridors or regulations.
      required:
      - transaction.mgiTransactionId
      - transaction.receiveCountryCode
      - transaction.sendCountryCode
      - transaction.receiveAmount.value
      - transaction.receiveAmount.currencyCode
      - transaction.sender.person.firstName
      - transaction.sender.person.lastName
      - transaction.receiver.person.firstName
      - transaction.receiver.person.lastName
      - accountCode
      - accountNumber
    PostV1TransfersResponse:
      type: object
      properties:
        response.responseCode:
          type: string
          description: Transaction processing status.
        response.message:
          type: string
          description: Human‑readable status message.
        partnerTransactionId:
          type: string
          description: Optional partner transaction reference.
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
